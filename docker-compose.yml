  app:
    build: .
    container_name: upi_service
    ports:
      - "${PORT:-8083}:8083"
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-8083}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-upi_db}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    networks:
      - upi-network
    restart: unless-stopped
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  upi-network:
    driver: bridge
